[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarezain"
version = "0.1.0"
description = "Escáner visual de vulnerabilidades para tu red local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mikel Zalacain González" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "truststore>=0.9",
]

[project.scripts]
sarezain = "sarezain.__main__:main"

[project.urls]
Homepage = "https://mikelzalacain.com"
Repository = "https://github.com/mikelzalacain/sarezain"

[tool.setuptools]
packages = ["sarezain"]

[tool.setuptools.package-data]
sarezain = ["data/*.txt", "web/*", "web/vendor/*"]
